name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy backend/app

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    name: Web Interface Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check JavaScript syntax
        run: for file in frontend/public/assets/js/*.js; do node --check "$file"; done

      - name: Run logic tests
        working-directory: frontend
        run: npm test

  docker-integration:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          {
            echo "API_KEY=ci-$(openssl rand -hex 16)"
            echo "GROQ_API_KEY=ci-placeholder-not-used"
          } > .env

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -euo pipefail
          source .env
          curl -fsS http://localhost:8000/v1/health
          # The web interface is served with a strict content security policy.
          curl -fsS -D headers.txt http://localhost:8000/ | grep -q "AI Council"
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          curl -fsS http://localhost:8000/assets/js/main.js > /dev/null
          curl -fsS http://localhost:8000/v1/config | grep -q '"auth_required":true'
          # Authenticated endpoints must reject anonymous requests and accept the key.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/history)" = "401"
          curl -fsS -H "X-API-Key: ${API_KEY}" http://localhost:8000/v1/history
          # Uploads are type-checked by content, not extension.
          printf 'not a pdf' > fake.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: ${API_KEY}" -F prompt='Should we?' -F files=@fake.pdf http://localhost:8000/v1/ask)" = "415"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
