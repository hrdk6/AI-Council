name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff (backend)
        run: |
          cd backend
          ruff check .

      - name: Run ruff (frontend)
        run: |
          cd frontend
          ruff check .

      - name: Run mypy (backend)
        run: |
          cd backend
          mypy app --ignore-missing-imports

      - name: Run mypy (frontend)
        run: |
          cd frontend
          mypy . --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run frontend tests
        run: |
          cd frontend
          pytest tests/ -v

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ai-council-backend:${{ github.sha }}
          load: true

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: ai-council-frontend:${{ github.sha }}
          load: true

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run docker-compose
        run: |
          docker-compose up -d
          sleep 30
          curl -f http://localhost:8000/v1/health
          curl -f http://localhost:8501/_stcore/health
          docker-compose down

      - name: Cleanup
        if: always()
        run: docker-compose down -v