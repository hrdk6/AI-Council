name: ai-council

# Usage: copy .env.example to .env, set GROQ_API_KEY and API_KEY, then `docker compose up --build`.
# Open http://localhost:8000 and enter the API_KEY value when the app asks for the access key.

services:
  council:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed so a local-development ENVIRONMENT value in .env cannot weaken the container.
      ENVIRONMENT: production
      API_KEY: ${API_KEY:?Set API_KEY in .env to a long random string}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      DATABASE_PATH: /app/data/ai_council.db
    ports:
      - "8000:8000"
    volumes:
      - council-data:/app/data
    restart: unless-stopped

volumes:
  council-data:
